name: CI

on:
  push:
    branches: [main, master, dev, develop]
  pull_request:
    branches: [main, master]

# 同一分支重复推送时取消上一次未完成的运行，避免排队浪费
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化，请执行 gofmt -w ."
            echo "$unformatted"
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 测试全部走 SQLite（纯 Go 驱动 modernc.org/sqlite），
      # 不需要额外起 MySQL / Redis 服务，runner 上零外部依赖。
      - name: Run tests
        run: go test -race -count=1 ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o build/server ./cmd/api

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: landc-permission-linux-amd64
          path: build/server
          retention-days: 7

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      # 只验证镜像可构建，不推送。发布镜像由 release 流程负责。
      - name: Build image
        run: docker build -t landc-permission:ci .
