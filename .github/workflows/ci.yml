name: CI

on:
  push:
    branches: [main, master, dev, develop]
  pull_request:
    branches: [main, master]

# 同一分支重复推送时取消上一次未完成的运行，避免排队浪费
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache: true

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化，请执行 gofmt -w ."
            echo "$unformatted"
            exit 1
          fi

  test:
    name: Test (CGO off)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache: true

      # 测试全部走 SQLite（纯 Go 驱动 modernc.org/sqlite），
      # 不需要额外起 MySQL / Redis 服务，runner 上零外部依赖。
      #
      # 显式 CGO_ENABLED=0：发布二进制与生产镜像都是纯静态无 CGO 的，
      # 测试必须跑在同一约束下。否则一旦有代码悄悄依赖 cgo（例如换回
      # mattn/go-sqlite3），测试会绿而镜像在运行期才炸。
      - name: Run tests
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 ./...

  race:
    name: Race detector
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache: true

      # -race 需要 CGO，与上面的 CGO off job 互补：
      # 一个保证与发布产物一致，一个抓并发缺陷。ubuntu runner 自带 gcc。
      - name: Run tests with race detector
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, race]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache: true

      - name: Build binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o build/server ./cmd/api

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: landc-permission-linux-amd64
          path: build/server
          retention-days: 7

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [test, race]
    steps:
      - uses: actions/checkout@v4

      # 只验证镜像可构建，不推送。发布镜像由 release 流程负责。
      - name: Build image
        run: docker build -t landc-permission:ci .

  security:
    name: Security Scan (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache: true

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...
