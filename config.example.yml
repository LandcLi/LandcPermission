# 服务器配置
server:
  port: 8082
  host: "0.0.0.0"
  read_timeout: 30
  write_timeout: 30

# 数据库配置
database:
  dsn: "root:password@tcp(127.0.0.1:3306)/landc_permission?charset=utf8mb4&parseTime=True&loc=Local"
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 3600

# Redis配置（可选，用于缓存。不配置时系统仍可正常运行，只是不使用缓存）
# redis:
#   addr: "localhost:6379"
#   password: ""
#   db: 0
#   pool_size: 10
#   min_idle_conns: 5

# 日志配置
log:
  level: "debug"
  output: "console"
  file: "logs/permission.log"

# 其他业务配置
other:
  server:
    gin_mode: "debug"
    use_default_route: true
