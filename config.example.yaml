# LandcPermission 配置示例
#
# 快速开始（零外部依赖）：
#   cp config.example.yaml config.yaml
#   go run ./cmd/api
#
# 切换到 MySQL（生产）：
#   database:
#     driver: "mysql"
#     dsn: "root:password@tcp(127.0.0.1:3306)/landc_permission?charset=utf8mb4&parseTime=True&loc=Local"
#     auto_migrate: false        # 生产改由 sqls/init.sql 建表

# 服务器配置
server:
  # 监听地址：框架按 addr:port 组合（addr 为空时回落到 :8080）
  addr: "0.0.0.0"
  port: 8082
  read_timeout: 30
  write_timeout: 30
  # 是否注册本系统自带的控制器路由（默认 true，通常无需显式配置）
  use_default_routes: true

# 数据库配置：默认 SQLite（纯 Go 驱动，无需 CGO / gcc / 外部服务）
database:
  driver: "sqlite"
  dsn: "data/landc_permission.db"
  # 开发/测试自动建表；生产环境（MySQL）请设为 false 并执行 sqls/init.sql
  auto_migrate: true
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 3600

# Redis 配置（可选，仅用于缓存；不配置时降级为进程内缓存，单实例可用）
# redis:
#   addr: "localhost:6379"
#   password: ""
#   db: 0
#   pool_size: 10
#   min_idle_conns: 5

# JWT 配置（框架鉴权中间件使用；secret 长度必须 >= 32 字符）
jwt:
  secret: "change-me-to-a-random-secret-at-least-32-chars"
  issuer: "landc-permission"

# 日志配置
log:
  level: "debug"
  output: "console"

# 其他业务配置
other:
  server:
    # gin 运行模式：debug / release / test
    # 注意：框架的 server 段没有 gin_mode 字段，本系统从 other.server 读取
    gin_mode: "debug"

  # 与 LandcOrg 集成（可选）
  #
  # 填写 base_url 后，用户从「部门 / 岗位」继承的角色会并入有效权限，
  # 即：有效权限 = 直接角色权限 ∪ 组织继承角色权限 ∪ 未过期直接权限。
  # LandcOrg 不可用时自动降级为只用直接角色，不会阻断权限判定（查询超时 3s）。
  # 留空或删除该段表示不集成。
  #
  # org_service:
  #   base_url: "http://127.0.0.1:8083"

  # 有效权限缓存（进程内）
  #
  # 一次权限判定要查 3~5 次库、并通过 HTTP 调 LandcOrg 取继承角色（超时 3s）。
  # 前端渲染一个菜单要判几十个权限，不缓存会把权限服务和组织服务一起打满。
  #
  # 一致性与性能的平衡：
  #   - 授权/撤销/角色权限变更会主动失效缓存，单实例下立刻生效；
  #   - 多副本部署时各副本独立缓存，TTL 就是最大不一致窗口；
  #   - 组织侧改了部门角色不会通知本服务，只能等 TTL 过期。
  # 设为 0 可完全关闭缓存 —— 排查「权限改了不生效」时先试这个。
  permission:
    effective_cache_ttl_seconds: 30
